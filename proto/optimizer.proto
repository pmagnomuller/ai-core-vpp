syntax = "proto3";

package vpp.optimizer.v1;

option go_package = "github.com/ai-core-vpp/orchestrator/gen/optimizerpb;optimizerpb";

// Optimizer produces an energy-management plan for a single smart-home device
// given recent telemetry history. The strategy is generated by an LLM and
// returned as a human-readable summary plus a list of concrete actions.
service Optimizer {
  rpc OptimizeStrategy(OptimizeRequest) returns (OptimizeResponse);
}

message TelemetryPoint {
  // RFC3339 timestamp of the measurement.
  string ts = 1;
  // Instantaneous household draw in kW.
  double kw_usage = 2;
  // Battery state-of-charge as a percentage [0, 100].
  double battery_soc_pct = 3;
  // Heat pump status: "heating" | "idle" | "cooling".
  string heatpump_status = 4;
  // Grid spot price in EUR/kWh at the time of the sample.
  double grid_price_eur_kwh = 5;
}

message OptimizeRequest {
  string device_id = 1;
  repeated TelemetryPoint history = 2;
}

message Action {
  // When to execute the action, e.g. "02:00-04:00" or "2026-04-24T02:00Z".
  string when = 1;
  // What to do, e.g. "charge_battery", "run_heatpump", "discharge_battery".
  string what = 2;
  // Natural-language justification suitable for a dashboard tooltip.
  string why = 3;
}

message OptimizeResponse {
  // One-paragraph executive summary of the plan.
  string strategy = 1;
  // Ordered list of actions for the next 24 hours.
  repeated Action actions = 2;
}
